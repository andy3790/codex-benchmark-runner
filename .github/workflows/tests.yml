name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check repository files and public examples
        run: python tools/check_repository.py
      - name: Run offline unit and mock integration tests
        run: python -m unittest discover -v
      - name: Generate synthetic report
        run: python tools/make_sample_report.py
      - name: Verify package build
        run: python -m pip wheel . --no-deps --wheel-dir dist
