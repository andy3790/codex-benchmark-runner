[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-benchmark-runner"
version = "1.0.0"
description = "Local, resumable Codex CLI benchmark runner with independent grading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/andy3790/codex-benchmark-runner"
Issues = "https://github.com/andy3790/codex-benchmark-runner/issues"

[project.scripts]
codex-bench = "codex_bench.cli:main"

[project.gui-scripts]
codex-bench-gui = "codex_bench.gui:main"

[tool.setuptools.packages.find]
include = ["codex_bench*"]
